<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VESTORA Live Try-On</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0f14;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      padding: 16px;
      user-select: none;
    }

    .popup-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .popup-logo {
      height: 24px;
      width: auto;
      max-width: 160px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .popup-sub {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    .popup-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: left;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .popup-btn:hover {
      background: rgba(139, 92, 246, 0.22);
      border-color: rgba(167, 139, 250, 0.5);
      transform: translateY(-1px);
    }
    .popup-btn.primary {
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
      border: none;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      margin-bottom: 8px;
    }
    .popup-btn.primary:hover {
      background: linear-gradient(135deg, #8b5cf6 0%, #818cf8 100%);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
    }
    .popup-btn svg { flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="popup-header">
    <img src="icons/vestora-logo.png" alt="VESTORA" class="popup-logo" />
    <span class="popup-sub">Live AI Virtual Try-On</span>
  </div>

  <button class="popup-btn primary" id="open-widget">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    Open Fitting Room
  </button>

  <button class="popup-btn" id="open-onboarding">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    How to Use
  </button>

  <script src="popup.js"></script>
</body>
</html>
