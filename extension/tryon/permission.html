<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VESTORA Camera Permission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1e1145 0%, #0c081e 60%, #05030a 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(26, 19, 58, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 28px;
      padding: 48px 40px;
      max-width: 480px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(124, 58, 237, 0.25);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #c4b5fd;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 12px 30px rgba(139, 92, 246, 0.45);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-allow {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 6px 24px rgba(124, 58, 237, 0.45);
      outline: none;
    }
    .btn-allow:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(124, 58, 237, 0.65);
    }
    .btn-allow:active {
      transform: translateY(0);
    }
    .status-msg {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #a78bfa;
      min-height: 22px;
    }
    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-pill">✦ VESTORA Live Try-On</div>
    <div class="icon-container">📹</div>
    <h1>Enable Live Camera</h1>
    <p>VESTORA uses your camera in real time so you can preview fashion items instantly on your body. Click below to allow camera access.</p>

    <button id="btn-allow" class="btn-allow">
      <span>Allow Camera Access</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>

    <div id="status" class="status-msg"></div>
    <p class="hint">🔒 Your camera feed is processed 100% locally on your device. Never recorded or sent to any server.</p>
  </div>

  <script>
    const btn = document.getElementById('btn-allow');
    const status = document.getElementById('status');

    async function requestCamera() {
      status.textContent = 'Requesting camera access from Chrome…';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        // Stop stream immediately after acquiring permission
        stream.getTracks().forEach((track) => track.stop());

        status.textContent = '✓ Camera permission granted! Starting VESTORA Live…';
        status.style.color = '#34d399';

        // Notify extension that camera permission was granted
        if (typeof chrome !== 'undefined' && chrome.runtime?.sendMessage) {
          chrome.runtime.sendMessage({ type: 'VESTORA_CAMERA_GRANTED' }).catch(() => {});
        }

        setTimeout(() => {
          window.close();
        }, 800);
      } catch (err) {
        status.textContent = 'Please click "Allow" in the Chrome address bar prompt.';
        status.style.color = '#fbbf24';
      }
    }

    btn.addEventListener('click', requestCamera);

    // Auto-prompt on page load after a tiny delay
    window.addEventListener('load', () => {
      setTimeout(requestCamera, 400);
    });
  </script>
</body>
</html>
